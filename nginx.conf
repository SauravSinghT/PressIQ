events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend_server {
        least_conn;
        server backend:8000;
    }

    server {
        listen 80;

        # OCR uploads are full-size images; the default 1m would 413 them, and an
        # nginx error page carries no CORS headers so it surfaces as a CORS error.
        client_max_body_size 25m;

        # React build produced by frontend/Dockerfile
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # API on the same origin as the SPA, so the browser issues no preflight
        # and needs no Access-Control-* headers. The trailing slash on proxy_pass
        # strips /api, keeping the FastAPI routes at /analyze, /explain, etc.
        location /api/ {
            proxy_pass http://backend_server/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tier-2 explanations call out to Gemini/Tavily and OCR is CPU-bound.
            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }
}
