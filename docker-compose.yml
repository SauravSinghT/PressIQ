services:
  # 1. FastAPI Application & ML Models
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pressiq_backend
    restart: always
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "8000"
    depends_on:
      - redis

  # 2. Redis In-Memory Vector & Claim Cache
  redis:
    image: redis:alpine
    container_name: pressiq_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Nginx Reverse Proxy / Load Balancer
  nginx:
    image: nginx:alpine
    container_name: pressiq_nginx_lb
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

networks:
  default:
    name: pressiq_network